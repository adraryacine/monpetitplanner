<!DOCTYPE html>
<html lang="fr" data-theme="rose">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon petit planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="bg-deco" aria-hidden="true">

      <span class="brand-logo">🌸</span>
      <div>
        <div class="brand-title">Mon petit planner</div>
        <div class="brand-sub" id="brand-sub">by toi, pour toi 💕</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/" data-route="">
        <span class="ico">🏡</span><span>Ma journée</span></a>
      <a href="#/todo" data-route="todo">

      <a href="#/stats" data-route="stats">
        <span class="ico">📊</span><span>Statistiques</span></a>
      <a href="#/reglages" data-route="reglages">
        <span class="ico">⚙️</span><span>Réglages</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="mini-quote" id="mini-quote"></div>
    </div>
  </aside>

  <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
  <main class="main" id="view"></main>

  <div class="toast-zone" id="toasts"></div>
  <script src="/vendor/chart.js/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
